name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: package.json's "packageManager" (pnpm@10.x) is the
      # single source of truth. pnpm/action-setup@v4 errors if both are set.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @gallery/support-desk test
      # e2e requires the backend image; enable once fastyoke/backend:local is pullable:
      # - run: pnpm backend:up && pnpm provision
      # - run: pnpm exec playwright install --with-deps chromium && pnpm e2e
