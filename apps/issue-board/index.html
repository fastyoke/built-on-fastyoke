<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Issue Board — built on FastYoke</title>
    <!-- Extensions are dynamically imported as blob modules with bare specifiers
         (react, react/jsx-runtime, @fastyoke/sdk). This import map routes those
         to shims that re-export the app's own instances (set on globalThis in
         main.tsx). Vite pre-resolves the app's own imports, so only the raw
         extension blobs consult this map. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/shims/react.js",
          "react/jsx-runtime": "/shims/react-jsx-runtime.js",
          "@fastyoke/sdk": "/shims/fastyoke-sdk.js"
        }
      }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
